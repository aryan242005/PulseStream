name: pulsestream
services:
  nats:
    image: nats:2.10.26-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: ["nats-data:/data"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: pulsestream:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app", "api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env first}
      NATS_URL: ${NATS_URL:?Copy .env.example to .env first}
      SHARD_COUNT: ${SHARD_COUNT:?Copy .env.example to .env first}
      MAX_DELIVERIES: ${MAX_DELIVERIES:?Copy .env.example to .env first}
      LOG_LEVEL: ${LOG_LEVEL:?Copy .env.example to .env first}
    ports: ["8000:8000"]
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    image: pulsestream:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env first}
      NATS_URL: ${NATS_URL:?Copy .env.example to .env first}
      SHARD_COUNT: ${SHARD_COUNT:?Copy .env.example to .env first}
      MAX_DELIVERIES: ${MAX_DELIVERIES:?Copy .env.example to .env first}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:?Copy .env.example to .env first}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:?Copy .env.example to .env first}
      LOG_LEVEL: ${LOG_LEVEL:?Copy .env.example to .env first}
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:?Copy .env.example to .env first}
volumes:
  nats-data:
  postgres-data:
